name: Example
groups:
  - Configs
options:
  bundleIdPrefix: eu.idura.sdk
usesTabs: false
identWidth: 2
packages:
  IduraVerify:
    path: ..
targets:
  Example:
    configFiles:
      Debug: Configs/config.xxconfig
    type: application
    supportedDestinations: [iOS]
    sources: [Example]
    dependencies:
      - package: IduraVerify
    entitlements:
      path: Example/Example.entitlements
      properties:
        com.apple.developer.associated-domains:
          - webcredentials:$(IDURA_DOMAIN)
          - applinks:$(IDURA_DOMAIN)
    info:
      path: Example/Info.plist
      properties:
        CFBundleDisplayName: "Idura Verify Example"
        IDURA_DOMAIN: $(IDURA_DOMAIN)
        IDURA_CLIENT_ID: $(IDURA_CLIENT_ID)
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphoneos*]: YES
        INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphonesimulator*]: YES
  ExampleUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources: [ExampleUITests]
    # Reuse the app's xcconfig so real-device runs inherit DEVELOPMENT_TEAM. The
    # simulator/CI mock run needs no signing, so an empty config.xxconfig is fine.
    configFiles:
      Debug: Configs/config.xxconfig
    dependencies:
      - target: Example
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Example
        # Automatic signing so `-allowProvisioningUpdates` mints a profile for the new test
        # bundle id on a device. DEVELOPMENT_TEAM comes from config.xxconfig; the Simulator
        # (CI) ignores signing entirely.
        CODE_SIGN_STYLE: Automatic
schemes:
  # Declared explicitly (rather than relying on Xcode's auto-generated scheme) so
  # `xcodebuild test -scheme Example` deterministically runs the UI tests in CI.
  Example:
    build:
      targets:
        Example: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ExampleUITests